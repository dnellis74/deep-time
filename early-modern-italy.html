<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Early Modern Italy</title>
<style>
  :root{
    --bg:#0d0e11; --ink:#f2f2f2; --dim:#9a9a9a; --accent:#ffd166;
    --panel:#16181d; --line:rgba(255,255,255,.14);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overscroll-behavior:none; }
  #stage{ position:fixed; inset:0; overscroll-behavior:none; }
  #tl{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; }
  #tl:active{ cursor:grabbing; }

  #chip{
    position:absolute; top:calc(10px + env(safe-area-inset-top)); left:12px;
    background:rgba(20,22,27,.88); border:1px solid var(--line); border-radius:10px;
    padding:7px 11px; font-size:12.5px; line-height:1.35; pointer-events:none;
    backdrop-filter:blur(4px); max-width:62vw;
  }
  #chip b{ font-weight:700; }
  #chip .sub{ color:var(--dim); font-size:11.5px; }
  @media (max-width:719px){
    #chip{ left:auto; right:12px; }
  }

  #zoomctl{ position:absolute; right:12px; bottom:calc(84px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:8px; }
  #zoomctl button{
    width:46px; height:46px; border-radius:50%; border:1px solid var(--line);
    background:rgba(20,22,27,.92); color:var(--ink); font-size:22px; line-height:1;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  #zoomctl button:active{ background:#262a33; }
  #zoomctl{ align-items:flex-end; }
  #zoomctl #presentBtn{ width:auto; height:auto; padding:11px 16px; border-radius:20px; border:1px solid var(--line);
    background:rgba(20,22,27,.92); color:var(--ink); font-size:14px; cursor:pointer; }
  #zoomctl #presentBtn:active{ background:#262a33; }

  :root{ --sab: env(safe-area-inset-bottom, 0px); }
  /* Tray: bottom sheet on phone, right panel on desktop */
  #tray{ position:absolute; left:0; right:0; bottom:env(safe-area-inset-bottom, 0px); background:var(--panel);
    border-top:1px solid var(--line); border-radius:14px 14px 0 0;
    transform:translateY(calc(100% - 56px)); transition:transform .25s ease;
    max-height:62vh; display:flex; flex-direction:column; z-index:5; }
  #tray.open{ transform:translateY(0); }
  #trayHandle{ height:56px; flex:0 0 56px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; user-select:none; }
  #trayHandle .grab{ width:56px; height:6px; border-radius:3px; background:#3a3f49; }
  #trayHandle, #tray button, #tray .switch{ touch-action:manipulation; }
  #trayBody{ overflow-y:auto; overscroll-behavior:contain; touch-action:pan-y; padding:2px 18px calc(20px + env(safe-area-inset-bottom)); }
  #trayBody h3{ margin:14px 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:1.5px; color:var(--dim); }
  #trayBody h3:first-child{ margin-top:4px; }
  .dsbtn{ display:block; width:100%; text-align:left; margin:0 0 8px; padding:13px 12px;
    background:#1e2128; color:var(--ink); border:1px solid var(--line); border-radius:10px;
    font-size:14.5px; cursor:pointer; }
  .dsbtn.active{ border-color:var(--accent); }
  .seg{ display:flex; gap:8px; }
  .seg button{ flex:1; padding:13px 0; background:#1e2128; color:var(--ink);
    border:1px solid var(--line); border-radius:10px; font-size:14px; cursor:pointer; }
  .seg button.active{ border-color:var(--accent); }
  .row{ display:flex; align-items:center; justify-content:space-between; padding:12px 2px; font-size:14.5px; }
  .switch{ width:64px; height:44px; border-radius:22px; background:#2c313b; border:1px solid var(--line);
    position:relative; cursor:pointer; }
  .switch::after{ content:""; position:absolute; top:4px; left:4px; width:36px; height:36px;
    border-radius:50%; background:#8a8f99; transition:left .18s ease, background .18s ease; }
  .switch.on{ background:#3d4a2a; }
  .switch.on::after{ left:24px; background:var(--accent); }
  #resetBtn{ width:100%; padding:14px; margin-top:6px; background:#1e2128; color:var(--ink);
    border:1px solid var(--line); border-radius:10px; font-size:14.5px; cursor:pointer; }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chipbtn{ padding:13px 16px; background:#1e2128; color:var(--ink);
    border:1px solid var(--line); border-radius:16px; font-size:14px; cursor:pointer; }
  .chipbtn:active{ border-color:var(--accent); }
  .hint{ color:var(--dim); font-size:12.5px; line-height:1.5; padding:8px 2px 0; }

  #pop{ position:absolute; z-index:6; max-width:78vw; background:#1e2128;
    border:1px solid var(--line); border-radius:12px; padding:12px 14px; display:none;
    box-shadow:0 8px 28px rgba(0,0,0,.5); }
  #pop.show{ display:block; }
  #pop .t{ font-weight:700; font-size:14.5px; margin:0 22px 2px 0; }
  #pop .d{ color:var(--accent); font-size:12px; margin-bottom:6px; }
  #pop .b{ color:#cfcfcf; font-size:13px; line-height:1.45; }
  #popClose{ position:absolute; top:6px; right:8px; background:none; border:none; color:var(--dim);
    font-size:18px; cursor:pointer; padding:4px 8px; }

  @media (min-width:720px){
    #tray{ left:auto; right:0; top:0; bottom:0; width:300px; border-radius:0;
      border-top:none; border-left:1px solid var(--line);
      transform:translateX(calc(100% - 46px)); max-height:none;
      flex-direction:row; }
    #tray.open{ transform:translateX(0); }
    #trayHandle{ flex:0 0 46px; height:auto; }
    #trayHandle .grab{ width:5px; height:44px; }
    #trayBody{ flex:1; padding:18px 18px 20px 6px; }
    #zoomctl{ bottom:calc(20px + env(safe-area-inset-bottom)); }
    #chip{ left:auto; right:58px; }

  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="tl"></canvas>
  <div id="chip"><b id="chipMain"></b><br><span class="sub" id="chipSub"></span></div>
  <div id="zoomctl">
    <button id="presentBtn">Present</button>
    <button id="zin" aria-label="Zoom in">+</button>
    <button id="zout" aria-label="Zoom out">&minus;</button>
  </div>
  <div id="tray">
    <div id="trayHandle" role="button" aria-label="Toggle settings"><div class="grab"></div></div>
    <div id="trayBody">
      <h3>Dataset</h3>
      <div id="dsList"></div>
      <div id="jumpSection">
        <h3>Jump to</h3>
        <div class="chips" id="presetChips"></div>
      </div>
      <h3>Label density</h3>
      <div class="seg" id="densitySeg">
        <button data-d="1.6">Sparse</button>
        <button data-d="1" class="active">Normal</button>
        <button data-d="0.55">Dense</button>
      </div>
      <h3>Display</h3>
      <div class="row"><span>Regions</span><div class="switch on" id="regionSwitch" role="switch" aria-checked="true"></div></div>
      <div class="hint">Tip: tap an era name on the timeline to zoom into it.</div>
      <button id="resetBtn">Reset view</button>
    </div>
  </div>
  <div id="pop">
    <button id="popClose" aria-label="Close">&times;</button>
    <div class="t" id="popTitle"></div>
    <div class="d" id="popDate"></div>
    <div class="b" id="popBlurb"></div>
  </div>
</div>
<noscript>Deep Time needs JavaScript.</noscript>
<script>window.__DATASETS__={"manifest":[{"file":"art.json","id":"early-modern-italy-art","title":"Renaissance Art"},{"file":"writing.json","id":"early-modern-italy-writing","title":"Humanist Writing"},{"file":"political-figures.json","id":"early-modern-italy-figures","title":"Political Figures"},{"file":"wars-and-kingdoms.json","id":"early-modern-italy-wars","title":"Wars and Kingdoms"},{"file":"europe.json","id":"early-modern-italy-europe","title":"European History"}],"sets":{"early-modern-italy-art":{"defaultPreset":"all","end":-326,"events":[{"blurb":"Giotto paints the Arena Chapel in Padua, giving sacred figures weight, grief, and physical presence. The frescoes break from flat Byzantine style and open the Renaissance in painting.","id":"giotto-arena","importance":90,"label":"Giotto, Arena Chapel, 1305","t":-721,"tier":3},{"blurb":"Duccio completes the Maest\u00e0, the great double-sided altarpiece for Siena Cathedral, blending Byzantine gold with a new tenderness and narrative detail.","id":"duccio-maesta","importance":62,"label":"Duccio, Maest\u00e0, 1311","t":-715,"tier":2},{"blurb":"Lorenzo Ghiberti, a young goldsmith, wins the competition for the Florence Baptistery's north doors with his Sacrifice of Isaac. The contest is often called the opening event of Renaissance art.","id":"ghiberti-doors","importance":70,"label":"Ghiberti wins the doors, 1401","t":-625,"tier":3},{"blurb":"Filippo Brunelleschi raises the dome of Florence Cathedral without scaffolding, using a herringbone brick pattern and a double shell. It remains the largest masonry dome ever built.","id":"brunelleschi-dome","importance":88,"label":"Brunelleschi's dome, 1420-1436","t":-606,"tEnd":-590,"tier":3},{"blurb":"Masaccio paints the Brancacci Chapel frescoes in Florence, using single-point perspective and stark, unidealized bodies. He dies at twenty-seven, but his work becomes the textbook for the next generation.","id":"masaccio-brancacci","importance":74,"label":"Masaccio, Brancacci Chapel, c. 1425","t":-601,"tier":2},{"blurb":"Donatello casts his bronze David, the first freestanding nude male sculpture since antiquity and the first unsupported standing bronze of the Renaissance.","id":"donatello-david","importance":78,"label":"Donatello, bronze David, c. 1440","t":-586,"tier":2},{"blurb":"Leon Battista Alberti finishes the facade of the Palazzo Rucellai, applying classical pilasters and proportions to a Florentine townhouse and fixing the grammar of Renaissance architecture.","id":"alberti-rucellai","importance":52,"label":"Alberti, Palazzo Rucellai, 1451","t":-575,"tier":1},{"blurb":"Botticelli paints the Primavera, a pagan allegory of spring crowded with classical gods, almost certainly for a Medici villa. It is the Renaissance's fullest embrace of mythology as subject matter.","id":"botticelli-primavera","importance":66,"label":"Botticelli, Primavera, c. 1482","t":-544,"tier":2},{"blurb":"Botticelli paints the Birth of Venus, placing a nude classical goddess at the center of a major work for the first time in a thousand years.","id":"botticelli-venus","importance":84,"label":"Botticelli, Birth of Venus, c. 1485","t":-541,"tier":2},{"blurb":"Leonardo finishes the Last Supper in Milan, arranging the apostles in four groups of three around Christ and using perspective to make the painted room continue the monks' refectory.","id":"leonardo-supper","importance":92,"label":"Leonardo, Last Supper, 1498","t":-528,"tier":3},{"blurb":"Leonardo begins the portrait of Lisa Gherardini in Florence. He carries it with him for the rest of his life, and it becomes the most famous painting in the world.","id":"leonardo-mona-lisa","importance":80,"label":"Leonardo begins the Mona Lisa, 1503","t":-523,"tier":2},{"blurb":"Michelangelo completes the David, carved from a single rejected block of marble, and Florence sets it before the Palazzo Vecchio as a symbol of the republic.","id":"michelangelo-david","importance":95,"label":"Michelangelo, David, 1504","t":-522,"tier":3},{"blurb":"Pope Julius II lays the foundation stone for the new St Peter's Basilica, designed by Bramante. The rebuilding takes 120 years and becomes the architectural project of the age.","id":"st-peters","importance":86,"label":"St Peter's rebuilding, 1506-1626","t":-520,"tEnd":-400,"tier":2},{"blurb":"Raphael completes the School of Athens in the Vatican's Stanza della Segnatura, gathering the philosophers of antiquity under a vast perspectival vault, Plato and Aristotle at the vanishing point.","id":"raphael-athens","importance":82,"label":"Raphael, School of Athens, 1511","t":-515,"tier":2},{"blurb":"Michelangelo completes the Sistine Chapel ceiling, nine scenes from Genesis framed by prophets and sibyls, painted lying on scaffolding over four years.","id":"michelangelo-sistine","importance":94,"label":"Michelangelo, Sistine Ceiling, 1512","t":-514,"tier":3},{"blurb":"Titian completes the Assumption of the Virgin for Santa Maria Gloriosa dei Frari in Venice, a towering altarpiece that makes color and light, rather than Florentine line, the basis of painting.","id":"titian-assumption","importance":68,"label":"Titian, Assumption, 1518","t":-508,"tier":2},{"blurb":"Michelangelo completes the Last Judgment on the Sistine altar wall, a writhing mass of risen bodies that shocks Rome with its nudity and inaugurates Mannerism's successor age.","id":"michelangelo-judgment","importance":76,"label":"Michelangelo, Last Judgment, 1541","t":-485,"tier":2},{"blurb":"Andrea Palladio's Teatro Olimpico in Vicenza, the oldest surviving indoor theater, is completed after his death. Its forced-perspective streets behind the stage become the model for theater design.","id":"palladio-teatro","importance":50,"label":"Palladio, Teatro Olimpico, 1585","t":-441,"tier":1},{"blurb":"Caravaggio completes the Calling of Saint Matthew in San Luigi dei Francesi, Rome, plunging a tavern scene into darkness cut by a single shaft of light. The chiaroscuro shocks Rome and founds Baroque painting.","id":"caravaggio-matthew","importance":72,"label":"Caravaggio, Calling of St Matthew, 1600","t":-426,"tier":3},{"blurb":"Bernini completes Apollo and Daphne for Cardinal Borghese, marble caught mid-transformation: bark creeping up Daphne's legs, leaves sprouting from her fingers. Baroque sculpture has arrived.","id":"bernini-daphne","importance":60,"label":"Bernini, Apollo and Daphne, 1625","t":-401,"tier":2}],"id":"early-modern-italy-art","maxSpan":700,"minSpan":1,"presets":[{"c":-626,"id":"all","label":"All","s":600},{"c":-651,"id":"beginnings","label":"Beginnings","s":150},{"c":-501,"id":"high-renaissance","label":"High Renaissance","s":70}],"start":-926,"timeFormat":"ago","title":"Renaissance Art","unit":"years"},"early-modern-italy-writing":{"defaultPreset":"all","end":-326,"events":[{"blurb":"Dante completes the Divine Comedy, the journey through Hell, Purgatory, and Paradise written in Tuscan Italian rather than Latin. It fixes the Italian language and makes a Florentine exile the judge of popes and emperors.","id":"dante-comedy","importance":88,"label":"Dante completes the Comedy, c. 1320","t":-706,"tier":2},{"blurb":"Petrarch is crowned Poet Laureate in Rome, the first since antiquity. His recovery of Cicero's letters and his Italian lyrics make him the father of humanism.","id":"petrarch-laureate","importance":90,"label":"Petrarch crowned laureate, 1341","t":-685,"tier":3},{"blurb":"Boccaccio completes the Decameron, one hundred tales told by young Florentines fleeing the Black Death. Its prose becomes a model for Italian literature.","id":"boccaccio-decameron","importance":78,"label":"Boccaccio, Decameron, c. 1353","t":-673,"tier":2},{"blurb":"The Byzantine scholar Manuel Chrysoloras begins teaching Greek in Florence, the first regular Greek instruction in western Europe for centuries. His pupils include the next generation of humanists.","id":"chrysoloras","importance":60,"label":"Chrysoloras teaches Greek, 1397","t":-629,"tier":1},{"blurb":"Matteo Palmieri writes Della vita civile, a dialogue arguing that the good citizen serves the republic through public life. It is the clearest statement of Florentine civic humanism.","id":"palmieri","importance":52,"label":"Palmieri, On Civic Life, 1429","t":-597,"tier":1},{"blurb":"Lorenzo Valla demonstrates, from the Latin itself, that the Donation of Constantine, the document by which the papacy claimed the western empire, is a forgery written centuries after Constantine's death.","id":"valla","importance":84,"label":"Valla exposes the Donation, 1440","t":-586,"tier":3},{"blurb":"Marsilio Ficino's complete Latin Plato is published, the first translation of the whole surviving corpus. Under Medici patronage at Careggi, Ficino fuses Plato with Christianity into Neoplatonism.","id":"ficino-plato","importance":76,"label":"Ficino's Plato published, 1484","t":-542,"tier":2},{"blurb":"Giovanni Pico della Mirandola writes his 900 Theses and the Oration on the Dignity of Man, arguing that humans, unlike angels or beasts, choose their own nature. The Oration becomes the manifesto of the Renaissance.","id":"pico","importance":86,"label":"Pico's Oration, 1486","t":-540,"tier":3},{"blurb":"Aldus Manutius sets up his press in Venice, printing the Greek and Latin classics in small, affordable octavo volumes with italic type. The portable book spreads humanism beyond scholars to students and merchants.","id":"aldine-press","importance":70,"label":"Aldine Press founded, 1495","t":-531,"tier":2},{"blurb":"The Aldine Press publishes the Hypnerotomachia Poliphili, a dream-romance of love and antiquity whose woodcuts and typography make it the most beautiful printed book of the Renaissance.","id":"hypnerotomachia","importance":64,"label":"Hypnerotomachia Poliphili, 1499","t":-527,"tier":2},{"blurb":"In retirement after his arrest, Machiavelli writes The Prince, a handbook arguing that a ruler must learn how not to be good when necessity demands it. It circulates in manuscript for nineteen years before printing.","id":"prince-written","importance":95,"label":"Machiavelli writes The Prince, 1513","t":-513,"tier":3},{"blurb":"Ludovico Ariosto publishes the first edition of Orlando Furioso, the chivalric epic that becomes Italy's national poem, mixing knights, magic, and irony.","id":"ariosto","importance":72,"label":"Ariosto, Orlando Furioso, 1516","t":-510,"tier":2},{"blurb":"Machiavelli writes La Mandragola, a comedy of adultery and corruption in Florence that doubles as a portrait of a society that has lost its civic virtue.","id":"mandragola","importance":58,"label":"Machiavelli, Mandragola, 1518","t":-508,"tier":2},{"blurb":"Baldassare Castiglione publishes The Book of the Courtier, the dialogue that defines the ideal courtier: educated, graceful, and concealing his effort under sprezzatura, studied nonchalance.","id":"castiglione","importance":80,"label":"Castiglione, The Courtier, 1528","t":-498,"tier":3},{"blurb":"Machiavelli's Discourses on Livy are published posthumously, arguing the opposite case from The Prince: that republics, not princes, preserve liberty, and that Rome's tumults made it great.","id":"discourses","importance":68,"label":"Discourses published, 1531","t":-495,"tier":1},{"blurb":"The Prince is finally printed, five years after Machiavelli's death. The word Machiavellian enters the languages of Europe within a generation.","id":"prince-published","importance":92,"label":"The Prince published, 1532","t":-494,"tier":2},{"blurb":"Giorgio Vasari publishes the Lives of the Most Excellent Painters, Sculptors, and Architects, inventing art history: the story of art's rebirth from Giotto to Michelangelo.","id":"vasari","importance":74,"label":"Vasari, Lives of the Artists, 1550","t":-476,"tier":3},{"blurb":"Francesco Guicciardini's History of Italy is published posthumously, the great narrative of the Italian Wars by a man who served popes and Medici through them. It replaces chronicle with political analysis.","id":"guicciardini","importance":66,"label":"Guicciardini, History of Italy, 1561","t":-465,"tier":2},{"blurb":"Galileo publishes the Sidereus Nuncius, reporting what his telescope found: the Moon's mountains, the stars of the Milky Way, and four moons of Jupiter. Astronomy will never be the same.","id":"galileo-sidereus","importance":82,"label":"Galileo, Starry Messenger, 1610","t":-416,"tier":3},{"blurb":"Galileo publishes the Dialogue Concerning the Two Chief World Systems, defending Copernicus in Italian for a general readership. The book's success forces the confrontation with the Inquisition.","id":"galileo-dialogue","importance":85,"label":"Galileo, Dialogue, 1632","t":-394,"tier":2},{"blurb":"The Inquisition condemns Galileo, bans the Dialogue, and sentences him to house arrest for the rest of his life. He abjures, and the trial becomes the symbol of science against authority.","id":"galileo-condemned","importance":62,"label":"Galileo condemned, 1633","t":-393,"tier":1}],"id":"early-modern-italy-writing","maxSpan":700,"minSpan":1,"presets":[{"c":-626,"id":"all","label":"All","s":600},{"c":-606,"id":"humanism","label":"Humanism","s":160},{"c":-493,"id":"machiavelli-age","label":"Age of Machiavelli","s":70}],"start":-926,"timeFormat":"ago","title":"Humanist Writing","unit":"years"},"early-modern-italy-figures":{"defaultPreset":"all","end":-326,"events":[{"blurb":"Florence expels Dante and sentences him to burning if he returns. In exile he writes the Comedy, and the Black and White Guelph feud that cast him out becomes the poem's political spine.","id":"dante-exile","importance":70,"label":"Dante exiled, 1302","t":-724,"tier":3},{"blurb":"Henry VII of Luxembourg crosses the Alps to restore imperial authority in Italy, the last emperor to campaign seriously for the Italian crown. Dante hails him as a savior; the cities mostly resist.","id":"henry-enters","importance":56,"label":"Henry VII enters Italy, 1310","t":-716,"tier":2},{"blurb":"Henry VII dies of fever at Buonconvento while campaigning against Naples. His expedition collapses, and no emperor will rule Italy again.","id":"henry-dies","importance":50,"label":"Henry VII dies, 1313","t":-713,"tier":1},{"blurb":"Cosimo de' Medici returns from exile and becomes Florence's uncrowned ruler, ruling through the republic's institutions while funding Brunelleschi, Donatello, and Ficino.","id":"cosimo-returns","importance":80,"label":"Cosimo returns, 1434","t":-592,"tier":3},{"blurb":"Cosimo dies, honored as Pater Patriae, father of his country. His son Piero inherits the Medici bank, the family's political machine, and its debts.","id":"cosimo-dies","importance":62,"label":"Cosimo dies, 1464","t":-562,"tier":2},{"blurb":"Niccol\u00f2 Machiavelli is born in Florence, the son of a lawyer, into a republic that has just passed from Cosimo's heirs to Lorenzo the Magnificent.","id":"machiavelli-born","importance":88,"label":"Machiavelli born, 1469","t":-557,"tier":3},{"blurb":"Lorenzo the Magnificent takes power in Florence at twenty, ruling as prince in all but name and bankrolling the artists and humanists who define the age.","id":"lorenzo-power","importance":82,"label":"Lorenzo takes power, 1469","t":-557,"tier":3},{"blurb":"Lorenzo dies at forty-three, and his son Piero proves unequal to the French invasion two years later. Florence expels the Medici and the republic returns.","id":"lorenzo-dies","importance":74,"label":"Lorenzo dies, 1492","t":-534,"tier":2},{"blurb":"Rodrigo Borgia is elected Pope Alexander VI, and sets about carving a state in central Italy for his son Cesare, using the papacy as a family enterprise.","id":"alexander-vi","importance":60,"label":"Alexander VI elected, 1492","t":-534,"tier":2},{"blurb":"After the Medici fall, the Dominican friar Girolamo Savonarola rules Florence as a moral dictator, burning vanities and preaching against the corrupt papacy.","id":"savonarola-rises","importance":66,"label":"Savonarola rises, 1494","t":-532,"tier":2},{"blurb":"Ludovico Sforza, who invited the French into Italy to secure his own claim, becomes Duke of Milan in name as well as fact.","id":"ludovico-duke","importance":58,"label":"Ludovico becomes duke, 1494","t":-532,"tier":2},{"blurb":"Savonarola is hanged and burned in the Piazza della Signoria, excommunicated and condemned after his theocracy collapses. Florence returns to republican government.","id":"savonarola-executed","importance":72,"label":"Savonarola executed, 1498","t":-528,"tier":3},{"blurb":"Machiavelli enters the Florentine chancery as secretary, beginning fourteen years of diplomatic missions to France, the papacy, and Cesare Borgia's camp, the education behind his political writing.","id":"machiavelli-chancery","importance":84,"label":"Machiavelli enters the chancery, 1498","t":-528,"tier":3},{"blurb":"The French capture Ludovico Sforza at Novara and carry him to France, where he dies in prison. Milan's independence ends with him.","id":"ludovico-captured","importance":54,"label":"Ludovico captured, 1500","t":-526,"tier":2},{"blurb":"Giuliano della Rovere is elected Pope Julius II, the warrior pope who will commission the Sistine Ceiling, raise the League of Cambrai, and personally lead armies in the field.","id":"julius-ii","importance":68,"label":"Julius II elected, 1503","t":-523,"tier":2},{"blurb":"Alexander VI dies, probably of malaria, and Cesare Borgia's state collapses within months. Machiavelli, who watched Cesare's rise, takes the lesson that fortune abandons even the ablest prince.","id":"cesare-falls","importance":52,"label":"Cesare Borgia falls, 1503","t":-523,"tier":1},{"blurb":"When the Medici return with a Spanish army, Machiavelli is arrested, tortured on the strappado, and retired to his farm at Sant'Andrea. There he writes The Prince.","id":"machiavelli-arrested","importance":90,"label":"Machiavelli arrested, 1513","t":-513,"tier":3},{"blurb":"Giovanni de' Medici is elected Pope Leo X, Lorenzo's son, who will spend the papacy's fortune on art and war and face Luther's revolt four years later.","id":"leo-x","importance":64,"label":"Leo X elected, 1513","t":-513,"tier":2},{"blurb":"Cardinal Giulio de' Medici commissions Machiavelli to write the Florentine Histories, the republic's official history from its origins to Lorenzo's death.","id":"machiavelli-histories","importance":76,"label":"Machiavelli commissioned, 1520","t":-506,"tier":2},{"blurb":"Machiavelli dies at fifty-eight, days after the Sack of Rome and the last expulsion of the Medici, hoping in vain for a post in the restored republic.","id":"machiavelli-dies","importance":92,"label":"Machiavelli dies, 1527","t":-499,"tier":3},{"blurb":"Charles V is crowned Holy Roman Emperor by the pope at Bologna, the last imperial coronation in Italy. The emperor who sacked Rome three years earlier now poses as the Church's protector.","id":"charles-crowned","importance":78,"label":"Charles V crowned at Bologna, 1530","t":-496,"tier":2},{"blurb":"Catherine de' Medici, born in Florence and married into the French royal house, becomes Queen of France. She will rule through her sons for thirty years of religious war.","id":"catherine-queen","importance":55,"label":"Catherine becomes queen, 1547","t":-479,"tier":2},{"blurb":"On St Bartholomew's Day, Parisian Catholics massacre thousands of Huguenots gathered for a royal wedding. Catherine's part in the decision remains debated; the massacre defines her reputation.","id":"st-bartholomew","importance":86,"label":"St Bartholomew's Day, 1572","t":-454,"tier":3},{"blurb":"Catherine de' Medici dies at Blois, having outlived her husband and three king sons. The Valois dynasty she held together dies with her son Henry III seven months later.","id":"catherine-dies","importance":48,"label":"Catherine dies, 1589","t":-437,"tier":1}],"id":"early-modern-italy-figures","maxSpan":700,"minSpan":1,"presets":[{"c":-626,"id":"all","label":"All","s":600},{"c":-563,"id":"medici","label":"The Medici","s":60},{"c":-528,"id":"machiavelli-life","label":"Life of Machiavelli","s":60}],"start":-926,"timeFormat":"ago","title":"Political Figures","unit":"years"},"early-modern-italy-wars":{"defaultPreset":"all","end":-326,"events":[{"blurb":"Emperor Frederick Barbarossa summons the northern Italian cities to the Diet of Roncaglia and asserts sweeping imperial rights over them, including taxation and the appointment of city officials. The cities resist, and the conflict hardens into the Guelph-Ghibelline divide: the Guelphs backing the pope, the Ghibellines the emperor.","id":"roncaglia","importance":55,"label":"Diet of Roncaglia, 1158","t":-868,"tier":2},{"blurb":"After years of defiance, Barbarossa takes Milan and razes it, scattering its people. The destruction becomes the founding grievance of the Lombard League.","id":"milan-razed","importance":50,"label":"Milan razed, 1162","t":-864,"tier":1},{"blurb":"The cities of Lombardy swear the Lombard League against the emperor, pooling their armies and revenues to defend communal self-government.","id":"lombard-league","importance":60,"label":"Lombard League formed, 1167","t":-859,"tier":2},{"blurb":"The Lombard League's infantry, dug in around its carroccio, holds against Barbarossa's knights at Legnano, and the regrouped League cavalry routs the imperial army. The victory saves the communes and forces the emperor to negotiate.","id":"legnano","importance":88,"label":"Legnano, 1176","t":-850,"tier":3},{"blurb":"The Peace of Constance confirms the Lombard cities' rights to elect their consuls and govern themselves, in exchange for recognizing imperial overlordship. The communes survive as self-governing states inside the empire.","id":"constance","importance":70,"label":"Peace of Constance, 1183","t":-843,"tier":2},{"blurb":"Emperor Frederick II crushes the Lombard League's army at Cortenuova, capturing the carroccio itself. It is the high-water mark of Hohenstaufen power in northern Italy.","id":"cortenuova","importance":62,"label":"Cortenuova, 1237","t":-789,"tier":2},{"blurb":"Parma's defenders sally out and sack Frederick II's siege camp, capturing his treasure and crown. The defeat breaks the emperor's grip on Lombardy, and he dies two years later.","id":"parma","importance":58,"label":"Parma turns the tide, 1248","t":-778,"tier":1},{"blurb":"Florence's Guelph army is annihilated by Siena's Ghibellines at Montaperti. Florence falls to the Ghibellines, and the battle lives on in Dante's poem.","id":"montaperti","importance":66,"label":"Montaperti, 1260","t":-766,"tier":2},{"blurb":"Charles of Anjou, granted the Sicilian crown by the pope, defeats and kills Manfred, Frederick II's son, at Benevento. A French Angevin dynasty takes Naples and Sicily, and the Guelphs triumph in the south.","id":"benevento","importance":90,"label":"Benevento, 1266","t":-760,"tier":3},{"blurb":"Conradin, the last Hohenstaufen claimant, is defeated at Tagliacozzo and beheaded at Naples on Charles of Anjou's orders. Hohenstaufen rule in Italy ends.","id":"tagliacozzo","importance":72,"label":"Tagliacozzo, 1268","t":-758,"tier":2},{"blurb":"On Easter Monday in Palermo, a revolt against Angevin officials explodes into a massacre of the French. Peter III of Aragon lands in support of the rebels, and the War of the Sicilian Vespers splits the island from Naples for good.","id":"vespers","importance":85,"label":"Sicilian Vespers, 1282","t":-744,"tier":3},{"blurb":"The Peace of Caltabellotta ends twenty years of war over Sicily: the island goes to Aragon, Naples stays Angevin. The split between the Two Sicilies lasts until the nineteenth century.","id":"caltabellotta","importance":52,"label":"Peace of Caltabellotta, 1302","t":-724,"tier":1},{"blurb":"Gian Galeazzo Visconti, who had nearly united northern Italy under Milan, dies of plague at Melegnano. His empire collapses into succession chaos, and the peninsula's balance resets.","id":"visconti-dies","importance":54,"label":"Visconti's empire collapses, 1402","t":-624,"tier":1},{"blurb":"Venice, Milan, Florence, Naples, and the Papal States sign the Peace of Lodi, freezing Italy's borders and creating a balance-of-power system that holds, more or less, for forty years.","id":"lodi","importance":78,"label":"Peace of Lodi, 1454","t":-572,"tier":3},{"blurb":"Charles VIII of France invades with 25,000 men and a mobile siege train that shatters city walls in days. He marches the length of Italy and takes Naples, ending the Lodi balance and opening sixty-five years of foreign war over the peninsula.","id":"charles-invades","importance":95,"label":"Charles VIII invades, 1494","t":-532,"tier":3},{"blurb":"The League of Venice tries to cut off Charles VIII's retreat at Fornovo. The French fight through and escape, but the invasion has taught every European power that Italy is up for grabs.","id":"fornovo","importance":64,"label":"Fornovo, 1495","t":-531,"tier":2},{"blurb":"Louis XII's French army seizes Milan and deposes the Sforza. Ludovico il Moro's fall ends Milan's independence and makes Lombardy a French-Spanish battleground.","id":"french-milan","importance":68,"label":"France takes Milan, 1499","t":-527,"tier":2},{"blurb":"Spanish troops under Gonzalo de C\u00f3rdoba win at the Garigliano, securing Naples for Spain. Southern Italy passes under Spanish rule for the next two centuries.","id":"garigliano","importance":74,"label":"Garigliano, 1503","t":-523,"tier":2},{"blurb":"Pope Julius II's League of Cambrai turns on Venice, and a French army crushes the Venetians at Agnadello. Venice loses its mainland empire in a single day and spends years clawing it back.","id":"agnadello","importance":76,"label":"Agnadello, 1509","t":-517,"tier":2},{"blurb":"The French destroy a Spanish army at Ravenna but lose their commander, Gaston de Foix, in the pursuit. The costly victory marks the turn of the wars against France.","id":"ravenna","importance":60,"label":"Ravenna, 1512","t":-514,"tier":2},{"blurb":"Francis I crushes the Swiss pikemen defending Milan at Marignano, recovering the duchy for France. The battle ends Swiss expansion and makes Francis the arbiter of northern Italy.","id":"marignano","importance":80,"label":"Marignano, 1515","t":-511,"tier":2},{"blurb":"Imperial troops rout the French at La Bicocca, where Spanish arquebusiers behind earthworks slaughter the advancing Swiss. The battle announces the dominance of gunpowder infantry.","id":"bicocca","importance":56,"label":"La Bicocca, 1522","t":-504,"tier":2},{"blurb":"Imperial forces annihilate the French at Pavia and capture Francis I himself. The king signs the Treaty of Madrid renouncing French claims in Italy, though he repudiates it once free.","id":"pavia","importance":92,"label":"Pavia, 1525","t":-501,"tier":3},{"blurb":"Unpaid imperial troops, many of them Lutheran Landsknechte, storm Rome and sack it for months. The Sack breaks the High Renaissance, humiliates the papacy, and drives Clement VII into the emperor's camp.","id":"sack-rome","importance":94,"label":"Sack of Rome, 1527","t":-499,"tier":3},{"blurb":"The Treaty of Cateau-Cambr\u00e9sis ends the Italian Wars: France keeps Calais and a few fortresses but abandons Italy, and Spain emerges as the peninsula's dominant power for a century and a half.","id":"cateau","importance":84,"label":"Cateau-Cambr\u00e9sis, 1559","t":-467,"tier":3},{"blurb":"The Holy League fleet, led by Don John of Austria with a large Venetian contingent, destroys the Ottoman fleet at Lepanto. It is the last great galley battle in history and halts Ottoman expansion in the western Mediterranean.","id":"lepanto","importance":82,"label":"Lepanto, 1571","t":-455,"tier":2},{"blurb":"Imperial troops sack Mantua during the War of the Mantuan Succession, and plague follows the armies into the city. Mantua never recovers its Renaissance splendor.","id":"mantua","importance":48,"label":"Sack of Mantua, 1630","t":-396,"tier":1},{"blurb":"Charles II of Spain dies childless, bequeathing his empire to Philip of Anjou, grandson of Louis XIV. The succession crisis will plunge Europe into another war over Italy and Spain.","id":"charles-ii-dies","importance":44,"label":"Charles II of Spain dies, 1700","t":-326,"tier":2}],"id":"early-modern-italy-wars","maxSpan":700,"minSpan":1,"presets":[{"c":-626,"id":"all","label":"All","s":600},{"c":-796,"id":"guelph-ghibelline","label":"Guelphs and Ghibellines","s":160},{"c":-500,"id":"italian-wars","label":"Italian Wars","s":70}],"start":-926,"timeFormat":"ago","title":"Wars and Kingdoms","unit":"years"},"early-modern-italy-europe":{"defaultPreset":"all","end":-326,"events":[{"blurb":"Crusaders sack Constantinople, the richest city in Christendom, and carve it into a Latin empire. The blow permanently weakens Byzantium and diverts the crusading movement into plunder.","id":"fourth-crusade","importance":70,"label":"Fourth Crusade sacks Constantinople, 1204","t":-822,"tier":3},{"blurb":"King John seals Magna Carta at Runnymede, conceding that the king is subject to law. The charter's clauses on counsel and judgment become the foundation text of limited monarchy.","id":"magna-carta","importance":78,"label":"Magna Carta, 1215","t":-811,"tier":3},{"blurb":"Mongol armies crush the Poles at Legnica and the Hungarians at Mohi within days of each other, then withdraw on the death of the Great Khan. Europe escapes conquest by succession politics in Karakorum.","id":"mongols","importance":60,"label":"Mongols invade Europe, 1241","t":-785,"tier":3},{"blurb":"Plague reaches Europe from the Black Sea, killing roughly a third of the continent in four years. The labor shortage that follows ends serfdom in the west and empties whole villages.","id":"black-death","importance":90,"label":"Black Death reaches Europe, 1347","t":-679,"tier":3},{"blurb":"Johannes Gutenberg prints with movable metal type, and within a generation presses are running from London to Naples. The book stops being a luxury and starts being a weapon.","id":"gutenberg","importance":84,"label":"Gutenberg's press, c. 1450","t":-576,"tier":3},{"blurb":"Mehmed II takes Constantinople after a fifty-three-day siege, ending the Byzantine Empire after eleven centuries. Greek scholars flee west with their manuscripts, feeding the Renaissance.","id":"constantinople","importance":92,"label":"Fall of Constantinople, 1453","t":-573,"tier":3},{"blurb":"Columbus lands in the Bahamas, believing he has reached Asia. The voyage joins two worlds that had not touched for ten thousand years, and begins the European colonization of the Americas.","id":"columbus","importance":95,"label":"Columbus reaches the Americas, 1492","t":-534,"tier":3},{"blurb":"Martin Luther posts his 95 Theses at Wittenberg, challenging indulgences and, within years, the papacy itself. The Reformation splits western Christendom for good.","id":"luther","importance":94,"label":"Luther's 95 Theses, 1517","t":-509,"tier":3},{"blurb":"The surviving ship of Magellan's expedition returns to Spain, completing the first circumnavigation of the globe. The voyage proves the world is round, larger than believed, and mostly ocean.","id":"circumnavigation","importance":68,"label":"First circumnavigation completed, 1522","t":-504,"tier":3},{"blurb":"Copernicus publishes De revolutionibus on his deathbed, moving the Earth from the center of the universe. The book waits seventy years for its revolution to begin.","id":"copernicus","importance":80,"label":"Copernicus publishes, 1543","t":-483,"tier":3},{"blurb":"The Peace of Augsburg lets each German prince choose his territory's religion, Lutheran or Catholic. The formula, cuius regio, eius religio, freezes the Reformation's map for sixty years.","id":"augsburg","importance":64,"label":"Peace of Augsburg, 1555","t":-471,"tier":3},{"blurb":"The Spanish Armada, sent to invade England and restore Catholicism, is scattered by storms and English fireships around Gravelines. Spain's naval supremacy is broken, and England's sea power begins.","id":"armada","importance":76,"label":"Spanish Armada defeated, 1588","t":-438,"tier":3},{"blurb":"Henry IV of France issues the Edict of Nantes, granting Huguenots religious freedom and ending thirty-six years of French religious war.","id":"nantes","importance":58,"label":"Edict of Nantes, 1598","t":-428,"tier":3},{"blurb":"The Peace of Westphalia ends the Thirty Years' War, the most destructive conflict Europe had known. It establishes the sovereign state as the basic unit of international order.","id":"westphalia","importance":86,"label":"Peace of Westphalia, 1648","t":-378,"tier":3},{"blurb":"A relief army under John III Sobieski breaks the Ottoman siege of Vienna, the high-water mark of Ottoman expansion into Europe. The Habsburgs spend the next generation pushing the frontier back down the Danube.","id":"vienna","importance":72,"label":"Siege of Vienna lifted, 1683","t":-343,"tier":3},{"blurb":"Parliament invites William and Mary to take the English throne, deposing James II without a battle. The Glorious Revolution settles parliamentary supremacy and a Bill of Rights.","id":"glorious-revolution","importance":66,"label":"Glorious Revolution, 1688","t":-338,"tier":3},{"blurb":"Charles II of Spain dies childless, leaving his empire to a Bourbon grandson of Louis XIV. The succession dispute will set Europe fighting again within a year.","id":"charles-ii-europe","importance":52,"label":"Charles II of Spain dies, 1700","t":-326,"tier":3}],"id":"early-modern-italy-europe","maxSpan":700,"minSpan":1,"presets":[{"c":-626,"id":"all","label":"All","s":600},{"c":-697,"id":"medieval","label":"Medieval Prelude","s":250},{"c":-443,"id":"reformation-age","label":"Reformation Age","s":140}],"start":-926,"timeFormat":"ago","title":"European History","unit":"years"}}};</script>
<script>
'use strict';
/* ================= utils ================= */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const trim3=x=>parseFloat(x.toPrecision(3)).toString();
function fmtDate(t,ds){
  if(t===0) return 'present';
  const a=Math.abs(t), suf=ds.timeFormat==='ago'?' ago':'';
  if(a>=1e9) return trim3(a/1e9)+' Ga'+suf;
  if(a>=1e6) return trim3(a/1e6)+' Ma'+suf;
  if(a>=1e3) return trim3(a/1e3)+' ka'+suf;
  return Math.round(a)+' yr'+suf;
}
function fmtSpan(s,unit){
  if(s>=1e9) return '~'+trim3(s/1e9)+' billion '+unit;
  if(s>=1e6) return '~'+trim3(s/1e6)+' million '+unit;
  if(s>=1e3) return '~'+trim3(s/1e3)+' thousand '+unit;
  return '~'+Math.round(s)+' '+unit;
}
function eventDateStr(e,ds){
  const a=fmtDate(e.t,ds);
  return (e.tEnd!=null)? a+' to '+fmtDate(e.tEnd,ds) : a;
}

/* ================= state ================= */
const canvas=document.getElementById('tl'), ctx=canvas.getContext('2d');
const chipMain=document.getElementById('chipMain'), chipSub=document.getElementById('chipSub');
const state={ manifest:[], sets:{}, ds:null, selected:[], C:0, S:1, density:1, regions:true, anim:null };
let cssW=0, cssH=0, dpr=1, needRender=true;
let bottomInset=0; // px reserved at canvas bottom for the closed tray handle on phones (constant; tray overlays)
const viewH=()=>cssH-bottomInset;
let lastPlaced=[]; // hit-test records {e,ds,di,x,y,x0,x1,y0,y1}
let lastRegionLabels=[]; // hit-test records {conn,ds,x0,x1,y0,y1} for tap-to-zoom
let curDec=10; // snapped decade of current span; tiers gate on this, same as the chip
const spanDecade=()=>Math.round(Math.log10(state.S));

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,3);
  cssW=window.innerWidth; cssH=window.innerHeight;
  document.getElementById('stage').style.height=cssH+'px';
  canvas.width=Math.round(cssW*dpr); canvas.height=Math.round(cssH*dpr);
  const sab=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sab'))||0;
  bottomInset=cssW<720?56+10+sab:0; // closed handle + clearance + gesture bar; constant, tray overlays
  document.getElementById('zoomctl').style.bottom=cssW<720?(bottomInset+18)+'px':'';
  needRender=true;
  if(state.ds) draw(); // resizing the canvas erases it; repaint immediately
}
window.addEventListener('resize',resize);

/* ================= viewport ================= */
const viewLo=()=>state.C-state.S/2, viewHi=()=>state.C+state.S/2;
const yOf=t=>viewH()*(t-(state.C-state.S/2))/state.S;
const tOf=y=>(state.C-state.S/2)+state.S*y/viewH();
// combined range across the selected datasets; identical to the single
// dataset's range when only one is selected
function combinedRange(){
  const ss=selectedSets();
  if(!ss.length) return {start:0,end:0,minSpan:1,maxSpan:1};
  return {start:Math.min(...ss.map(d=>d.start)), end:Math.max(...ss.map(d=>d.end)),
          minSpan:Math.min(...ss.map(d=>d.minSpan)), maxSpan:Math.max(...ss.map(d=>d.maxSpan))};
}
function clampView(){
  const r=combinedRange(), span=r.end-r.start;
  state.S=clamp(state.S,r.minSpan,r.maxSpan);
  if(state.S>=span) state.C=(r.start+r.end)/2;
  else state.C=clamp(state.C,r.start+state.S/2,r.end-state.S/2);
}
function panBy(dy){ state.C-=dy*state.S/viewH(); clampView(); needRender=true; }
function zoomAt(y,factor){
  const r=combinedRange(), tm=tOf(y);
  state.S=clamp(state.S*factor,r.minSpan,r.maxSpan);
  state.C=tm+state.S/2-state.S*y/viewH();
  clampView(); needRender=true;
}
function animateTo(C1,S1,dur){
  dur=dur||280;
  state.anim={C0:state.C,S0:state.S,C1:S1!=null?C1:state.C,S1:S1,t0:performance.now(),dur:dur};
  requestAnimationFrame(animStep);
}
function animStep(now){
  const a=state.anim; if(!a) return;
  let p=clamp((now-a.t0)/a.dur,0,1);
  p=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
  state.C=a.C0+(a.C1-a.C0)*p;
  state.S=Math.exp(Math.log(a.S0)+(Math.log(a.S1)-Math.log(a.S0))*p);
  clampView(); needRender=true; draw();
  if(p<1) requestAnimationFrame(animStep); else { state.anim=null; scheduleLink(); }
}
function stopAnim(){ state.anim=null; }
function resetView(){
  const r=defaultViewRange();
  animateTo((r.start+r.end)/2,(r.end-r.start)*1.0,350);
}

/* ================= data ================= */
async function loadAll(){
  if(window.__DATASETS__){
    const inline=window.__DATASETS__;
    state.manifest=inline.manifest; state.sets=inline.sets;
    return;
  }
  const m=await (await fetch('datasets/manifest.json')).json();
  state.manifest=m;
  for(const item of m){
    state.sets[item.id]=await (await fetch('datasets/'+item.file)).json();
  }
}
function selectedSets(){ return visibleSets(); }
function setDatasets(ids,opts){
  opts=opts||{};
  // stable order: manifest order, not tap order, so a dataset always
  // renders in the same side or column
  const order=new Map(state.manifest.map((m,i)=>[m.id,i]));
  state.selected=ids.filter((id,i)=>ids.indexOf(id)===i&&state.sets[id])
    .sort((a,b)=>(order.has(a)?order.get(a):999)-(order.has(b)?order.get(b):999));
  if(!state.selected.length&&state.manifest.length) state.selected=['early-modern-italy-art','early-modern-italy-writing','early-modern-italy-figures','early-modern-italy-wars','early-modern-italy-europe'];
  state.ds=state.sets[state.selected[0]];
  stopAnim(); hidePopover();
  if(!opts.keepView){
    const q=new URLSearchParams(location.search);
    const urlIds=(q.get('d')||'').split(',').filter(Boolean);
    if(q.get('c')&&q.get('s')&&urlIds.length===state.selected.length&&urlIds.every(id=>state.selected.includes(id))){
      state.C=parseFloat(q.get('c')); state.S=parseFloat(q.get('s'));
    }else if(state.selected.length===1){
      const dp=(state.ds.presets||[]).find(p=>p.id===state.ds.defaultPreset);
      if(dp){ state.C=dp.c; state.S=dp.s; }
      else{ state.C=(state.ds.start+state.ds.end)/2; state.S=state.ds.end-state.ds.start; }
    }else{
      const r=defaultViewRange();
      state.C=(r.start+r.end)/2; state.S=r.end-r.start;
    }
  }
  clampView(); buildTrayList(); buildPresets(); needRender=true; draw();
}
function setDataset(id){ setDatasets([id]); }
function toggleDataset(id){
  if(state.selected.includes(id)){
    if(state.selected.length===1) return; // at least one dataset stays selected
    setDatasets(state.selected.filter(x=>x!==id),{keepView:true});
  }else{
    setDatasets([...state.selected,id],{keepView:true});
  }
  scheduleLink();
}
function buildPresets(){
  const box=document.getElementById('presetChips'); box.innerHTML='';
  const multi=state.selected.length>1;
  const presets=[];
  for(const ds of selectedSets()) for(const v of (ds.presets||[])) presets.push({v:v,ds:ds});
  document.getElementById('jumpSection').style.display=presets.length?'':'none';
  for(const p of presets){
    const b=document.createElement('button');
    b.className='chipbtn'; b.textContent=multi?p.v.label+' · '+p.ds.id:p.v.label;
    b.addEventListener('click',()=>{ stopAnim(); animateTo(p.v.c,p.v.s,350); });
    box.appendChild(b);
  }
}
function scheduleLink(){
  clearTimeout(scheduleLink.t);
  scheduleLink.t=setTimeout(()=>{
    const q=new URLSearchParams();
    q.set('d',state.selected.join(',')); q.set('c',state.C.toPrecision(6)); q.set('s',state.S.toPrecision(6));
    history.replaceState(null,'',location.pathname+'?'+q.toString());
  },600);
}

/* ================= render ================= */
const BG='#0d0e11', SPINE='rgba(255,255,255,.28)';
const ACCENTS=['#8ab4f8','#f0a868','#a8d8a8','#d8a8d8','#8ad8d8']; // per-dataset accent in multi mode
function spineX(){ if(state.selected.length>1&&!mergedView()) return cssW/2; return cssW<720?36:cssW/2; }
// Background layers (v0.23, model corrected v0.26): universe, earth, and
// human history are designated here, in the viewer code, not in the
// dataset files, so datasets stay reusable and carry no composition
// data. Foreground = every non-background dataset. Layout rule: one or
// two foreground timelines merge into one single timeline (the
// foreground integrated into the background, events drawn on one axis,
// regions painted as in merged mode); three or more foreground timelines
// render as columns of the foregrounds only, with no background rendered.
const BACKGROUND_IDS=['earth-history','human-history','powers-of-10'];
function hasBackground(){ return state.selected.some(id=>BACKGROUND_IDS.includes(id)); }
function extraCount(){ return state.selected.filter(id=>!BACKGROUND_IDS.includes(id)).length; }
function mergedView(){ return extraCount()<=2; }
function visibleSets(){
  const all=state.selected.map(id=>state.sets[id]).filter(Boolean);
  if(extraCount()>=3) return all.filter(ds=>!BACKGROUND_IDS.includes(ds.id));
  return all;
}
// Two or more foreground timelines open on the foregrounds' combined
// span, so the comparison is visible immediately; Reset returns there
// too. Panning and zooming still roam the full visible range
// (combinedRange).
function defaultViewRange(){
  if(extraCount()>=2){
    const ex=state.selected.filter(id=>!BACKGROUND_IDS.includes(id)).map(id=>state.sets[id]).filter(Boolean);
    return {start:Math.min(...ex.map(d=>d.start)), end:Math.max(...ex.map(d=>d.end))};
  }
  return combinedRange();
}
function columnsMode(){ return !mergedView()&&visibleSets().length>=3; }
function colW(){ return cssW/visibleSets().length; }
function colX(i){ return i*colW(); }
function colSpine(i){ return colX(i)+14; }

function draw(){
  if(!needRender&&!state.anim) return;
  needRender=false;
  curDec=spanDecade();
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=BG; ctx.fillRect(0,0,cssW,cssH);
  drawRegions();
  // spines: one central spine in single, two-dataset, and merged mode; one
  // spine per column in columns mode (three or more visible datasets)
  const sx=spineX();
  if(columnsMode()){
    for(let i=0;i<state.selected.length;i++){
      const sxi=colSpine(i);
      ctx.strokeStyle=SPINE; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(sxi,0); ctx.lineTo(sxi,viewH()); ctx.stroke();
    }
  }else{
    ctx.strokeStyle=SPINE; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(sx,0); ctx.lineTo(sx,viewH()); ctx.stroke();
  }
  drawPresent(sx);
  drawEvents(sx);
  updateChip();
}
function drawPresent(sx){
  if(!selectedSets().some(ds=>ds.end===0)) return;
  const y=yOf(0);
  if(y<-20||y>viewH()+20) return;
  ctx.strokeStyle='rgba(255,209,102,.7)'; ctx.lineWidth=1.5;
  ctx.setLineDash([6,5]); ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(cssW,y); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='#ffd166'; ctx.font='600 11px '+FONT;
  ctx.fillText('PRESENT',12,y-7);
}
const FONT='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';

function drawRegions(){
  lastRegionLabels=[];
  if(!state.regions) return;
  const lo=viewLo(), hi=viewHi();
  const multi=state.selected.length>1;
  // merged mode: every selected dataset's regions share one full-width
  // column, painted globally broadest span first (not per dataset), so a
  // broad region from one dataset sits beneath narrower regions from any
  // dataset, the same nesting rule single mode already uses.
  if(mergedView()){
    const items=[];
    for(const ds of selectedSets()){
      if(!ds.connections) continue;
      for(const b of ds.connections)
        if(b.form==='region'&&curDec<=b.tier&&b.tEnd>lo&&b.tStart<hi) items.push({b:b,ds:ds});
    }
    items.sort((a,b)=>(b.b.tEnd-b.b.tStart)-(a.b.tEnd-a.b.tStart));
    ctx.textBaseline='alphabetic';
    for(const {b,ds} of items){
      const y0=clamp(yOf(b.tStart),-60,cssH+60), y1=clamp(yOf(b.tEnd),-60,cssH+60);
      if(y1-y0<2) continue;
      ctx.fillStyle=b.color; ctx.fillRect(0,y0,cssW,y1-y0);
      if(y1-y0>=28&&y0<viewH()&&y1>0){
        ctx.fillStyle='rgba(255,255,255,.6)';
        ctx.font='600 11px '+FONT;
        if('letterSpacing' in ctx) ctx.letterSpacing='2px';
        const label=fitText(b.label.toUpperCase(),cssW-24);
        const ly=clamp(y0+18,14,viewH()-8);
        ctx.fillText(label,12,ly);
        if('letterSpacing' in ctx) ctx.letterSpacing='0px';
        const w=ctx.measureText(label).width;
        lastRegionLabels.push({conn:b,ds:ds,x0:4,x1:12+w+14,y0:ly-20,y1:ly+10});
      }
    }
    return;
  }
  ctx.textBaseline='alphabetic';
  selectedSets().forEach((ds,di)=>{
    if(!ds.connections) return;
    const list=ds.connections
      .filter(b=>b.form==='region'&&curDec<=b.tier&&b.tEnd>lo&&b.tStart<hi)
      .sort((a,b)=>(b.tEnd-b.tStart)-(a.tEnd-a.tStart));
    // single mode: full-width tints as before. Two-dataset mode: the two
    // datasets tint their half of the width. Columns mode (three or more):
    // every dataset tints its own column, so no dataset's eras sit on
    // another's.
    const cols=columnsMode();
    const half=!multi||di<2||cols;
    const x0=!multi?0:cols?colX(di):(di===0?0:cssW/2);
    const x1=!multi?cssW:cols?colX(di+1):(di===0?cssW/2:cssW);
    const labelX=!multi?12:cols?colX(di)+12:(di===0?12:cssW/2+12);
    const maxW=cols?colW()-24:(multi?cssW/2-24:cssW-24);
    for(const b of list){
      const y0=clamp(yOf(b.tStart),-60,cssH+60), y1=clamp(yOf(b.tEnd),-60,cssH+60);
      if(y1-y0<2) continue;
      if(half){ ctx.fillStyle=b.color; ctx.fillRect(x0,y0,x1-x0,y1-y0); }
      if(y1-y0>=28&&y0<viewH()&&y1>0){
        ctx.fillStyle='rgba(255,255,255,.6)';
        ctx.font='600 11px '+FONT;
        if('letterSpacing' in ctx) ctx.letterSpacing='2px';
        const label=fitText(b.label.toUpperCase(),maxW);
        const ly=clamp(y0+18,14,viewH()-8);
        ctx.fillText(label,labelX,ly);
        if('letterSpacing' in ctx) ctx.letterSpacing='0px';
        const w=ctx.measureText(label).width;
        lastRegionLabels.push({conn:b,ds:ds,x0:labelX-8,x1:labelX+w+14,y0:ly-20,y1:ly+10});
      }
    }
  });
}

// minimum events shown per dataset: when tier gating leaves a dataset thin
// in view, fill with its highest-importance in-view events regardless of
// tier, so sparse eras still show a few major events (v0.20). Promotion is
// eligibility only: the greedy declutter below still decides which of the
// visible events get labels, and busy views (tier-eligible >= PROMOTE_MIN)
// are untouched.
const PROMOTE_MIN=4;
function visibleEvents(){
  const lo=viewLo(), hi=viewHi();
  const out=[];
  for(const ds of selectedSets()){
    const inView=[];
    for(const e of ds.events){
      const t1=(e.tEnd!=null?e.tEnd:e.t);
      if(t1>=lo&&e.t<=hi) inView.push(e);
    }
    const eligible=ds.showAllEvents?inView:inView.filter(e=>curDec<=e.tier);
    let chosen=eligible;
    if(eligible.length<PROMOTE_MIN){
      const rest=inView.filter(e=>curDec>e.tier)
        .sort((a,b)=>(b.importance-a.importance)||(b.tier-a.tier)||(a.t-b.t));
      chosen=eligible.concat(rest.slice(0,PROMOTE_MIN-eligible.length));
    }
    out.push(...chosen);
  }
  return out;
}
function fitText(text,maxW){
  if(ctx.measureText(text).width<=maxW) return text;
  let t=text;
  while(t.length>1&&ctx.measureText(t+'...').width>maxW) t=t.slice(0,-1);
  return t+'...';
}
function drawEvents(sx){
  const evs=visibleEvents();
  const cols=columnsMode();
  const merged=mergedView();
  lastPlaced=[];
  const wide=cssW>=720;
  const multi=state.selected.length>1;
  // dataset lookup by event object: ids may repeat across datasets (the demo
  // and earth sets share several), so maps are keyed by object, never by id
  const dsOf=new Map(), diOf=new Map();
  selectedSets().forEach((ds,di)=>{ for(const e of ds.events){ dsOf.set(e,ds); diOf.set(e,di); } });
  // side assignment: chronological alternation in single mode (unchanged);
  // by dataset in two-dataset mode, first left, second right. Columns mode
  // ignores sides: each dataset owns a column, see the geometry below.
  const sideOf=new Map();
  // merged mode uses single-mode geometry: chronological alternation on
  // wide screens, right side on phones, one shared label column.
  if(!multi||merged){
    const chrono=[...evs].sort((a,b)=>a.t-b.t);
    chrono.forEach((e,i)=>sideOf.set(e,wide?(i%2===0?'r':'l'):'r'));
  }else{
    for(const e of evs) sideOf.set(e,diOf.get(e)===0?'l':'r');
  }
  // lane assignment for tall spans: overlapping ranges get their own lane so
  // overlaps read like a chart. Single mode keeps the old geometry (lanes
  // alternate sides on wide screens, stack right on phones). Multi mode
  // stacks lanes on the owning dataset's side.
  const laneOf=new Map();
  const isTall=e=>e.tEnd!=null&&Math.abs(yOf(e.tEnd)-yOf(e.t))>=36;
  const spansOverlap=(a0,a1,b0,b1)=>a0<=b1&&b0<=a1;
  const singleLaneGeom=i=>{
    if(wide){ const s=i%2===0?-1:1, k=(i/2)|0; return {bx:sx+s*(17+k*22), side:s<0?'l':'r'}; }
    return {bx:sx+17+i*20, side:'r'};
  };
  if(cols){
    const lanesByCol=selectedSets().map(()=>[]);
    for(const e of [...evs].filter(e=>e.tEnd!=null).sort((a,b)=>a.t-b.t)){
      if(!isTall(e)) continue;
      const ci=diOf.get(e);
      const lanes=lanesByCol[ci];
      let li=lanes.findIndex(l=>l.every(s=>!spansOverlap(e.t,e.tEnd,s[0],s[1])));
      if(li<0){ if(lanes.length<4){ lanes.push([]); li=lanes.length-1; } else li=3; }
      lanes[li].push([e.t,e.tEnd]);
      laneOf.set(e,{side:'r',bx:colSpine(ci)+17+li*18});
    }
  }else if(!multi||merged){
    const lanes=[];
    for(const e of [...evs].filter(e=>e.tEnd!=null).sort((a,b)=>a.t-b.t)){
      if(!isTall(e)) continue;
      let li=lanes.findIndex(l=>l.every(s=>!spansOverlap(e.t,e.tEnd,s[0],s[1])));
      if(li<0){ if(lanes.length<6){ lanes.push([]); li=lanes.length-1; } else li=5; }
      lanes[li].push([e.t,e.tEnd]);
      laneOf.set(e,singleLaneGeom(li));
    }
  }else{
    const lanesBySide={l:[],r:[]};
    for(const e of [...evs].filter(e=>e.tEnd!=null).sort((a,b)=>a.t-b.t)){
      if(!isTall(e)) continue;
      const side=diOf.get(e)===0?'l':'r';
      const lanes=lanesBySide[side];
      let li=lanes.findIndex(l=>l.every(s=>!spansOverlap(e.t,e.tEnd,s[0],s[1])));
      if(li<0){ if(lanes.length<6){ lanes.push([]); li=lanes.length-1; } else li=5; }
      lanes[li].push([e.t,e.tEnd]);
      laneOf.set(e,{side:side,bx:sx+(side==='l'?-1:1)*(17+li*22)});
    }
  }
  // dots and bars first
  for(const e of evs){
    const y=yOf(e.t);
    const g0=laneOf.get(e);
    if(g0){
      const ya=yOf(e.tEnd);
      const top=clamp(Math.min(y,ya),-40,cssH+40), bot=clamp(Math.max(y,ya),-40,cssH+40);
      ctx.fillStyle='rgba(122,162,247,.8)';
      const bw=10;
      ctx.beginPath();
      if(ctx.roundRect) ctx.roundRect(g0.bx-bw/2,top,bw,Math.max(bot-top,8),4); else ctx.rect(g0.bx-bw/2,top,bw,Math.max(bot-top,8));
      ctx.fill();
      lastPlaced.push({e:e,ds:dsOf.get(e),di:diOf.get(e),x:g0.bx,y:(top+bot)/2,x0:g0.bx-9,x1:g0.bx+9,y0:top,y1:bot,bar:true});
      continue;
    }
    if(e.tEnd!=null){
      const y1=yOf(e.tEnd);
      const top=clamp(Math.min(y,y1),-40,cssH+40), bot=clamp(Math.max(y,y1),-40,cssH+40);
      ctx.fillStyle='rgba(122,162,247,.55)';
      const bw=7;
      const barX=cols?colSpine(diOf.get(e)):sx;
      ctx.beginPath();
      if(ctx.roundRect) ctx.roundRect(barX-bw/2,top,bw,Math.max(bot-top,8),3); else ctx.rect(barX-bw/2,top,bw,Math.max(bot-top,8));
      ctx.fill();
    }else{
      if(y<-10||y>viewH()+10) continue;
      ctx.fillStyle=multi?ACCENTS[diOf.get(e)%ACCENTS.length]:(e.importance>=80?'#ffd166':'#e8e8e8');
      ctx.beginPath(); ctx.arc(cols?colSpine(diOf.get(e)):sx,y,e.importance>=80?5:4,0,Math.PI*2); ctx.fill();
    }
  }
  // labels, greedy by importance; in two-dataset mode collisions are per side,
  // so a left label never blocks a right label at the same height; in columns
  // mode collisions are per column, so no dataset's labels can cover another's
  const byImp=[...evs].sort((a,b)=>b.importance-a.importance);
  const claimed=[];
  const claimedSide={l:[],r:[]};
  const claimedCol=selectedSets().map(()=>[]);
  const pad=7*state.density;
  ctx.textBaseline='alphabetic';
  for(const e of byImp){
    const y=yOf(e.t);
    const g1=laneOf.get(e);
    let side, xA, maxW, tickFrom;
    if(cols){
      const ci=diOf.get(e);
      side='r';
      if(g1){ xA=g1.bx+12; tickFrom=g1.bx+5; }
      else{ xA=colSpine(ci)+14; tickFrom=colSpine(ci); }
      maxW=colX(ci+1)-xA-8;
    }else if(g1){
      side=g1.side;
      xA=g1.bx+(side==='r'?12:-12);
      maxW=side==='r'?cssW-xA-14:xA-14;
      tickFrom=g1.bx+(side==='r'?5:-5);
    }else{
      side=sideOf.get(e);
      xA=sx+(side==='r'?14:-14);
      maxW=(side==='r'?cssW-xA-14:xA-14);
      tickFrom=sx;
    }
    if(maxW<40) continue;
    ctx.font='600 14px '+FONT;
    const label=fitText(e.label,maxW);
    ctx.font='12px '+FONT;
    const sub=fitText(eventDateStr(e,dsOf.get(e)),maxW);
    const ly=clamp(y,26,viewH()-46);
    const top=ly-16, bot=ly+22;
    const cl=cols?claimedCol[diOf.get(e)]:(multi&&!merged)?claimedSide[side]:claimed;
    let clash=false;
    for(const c of cl){ if(top<c[1]+pad&&bot>c[0]-pad){clash=true;break;} }
    if(clash) continue;
    cl.push([top,bot]);
    const tx=side==='r'?xA:xA;
    ctx.textAlign=side==='r'?'left':'right';
    // tick
    ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(tickFrom,ly-4); ctx.lineTo(xA+(side==='r'?-4:4),ly-4); ctx.stroke();
    // merged labels take their dataset's accent (same color as its dots),
    // so the reader can tell which dataset a label belongs to in one column
    ctx.fillStyle=merged?ACCENTS[diOf.get(e)%ACCENTS.length]:'#f2f2f2'; ctx.font='600 14px '+FONT;
    ctx.fillText(label,tx,ly-4);
    ctx.fillStyle='#9a9a9a'; ctx.font='12px '+FONT;
    ctx.fillText(sub,tx,ly+13);
    ctx.textAlign='left';
    const w=Math.max(ctx.measureText(label).width,ctx.measureText(sub).width);
    lastPlaced.push({e:e,ds:dsOf.get(e),di:diOf.get(e),x:sx,y:y,x0:Math.min(tx,tx+(side==='r'?w:-w)),x1:Math.max(tx,tx+(side==='r'?w:-w)),y0:top,y1:bot});
  }
}

function updateChip(){
  // v0.24: the headline states the actual visible span; the snapped decade
  // is a zoom scale, not a year count, so it lives in the sub-line. The old
  // headline ("10^10 years visible") understated full-span views: 10 billion
  // claimed vs 13.8 billion shown on the background default.
  chipMain.innerHTML=fmtSpan(state.S,state.ds.unit)+' visible';
  chipSub.innerHTML='zoom 10<sup>'+curDec+'</sup>';
}

/* ================= gestures ================= */
const ptrs=new Map(); let pinchPrev=null, downInfo=null;
function evtPos(e){ const r=canvas.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
canvas.addEventListener('pointerdown',e=>{
  canvas.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,evtPos(e));
  pinchPrev=null; stopAnim(); hidePopover();
  if(ptrs.size===1) downInfo={p:evtPos(e),t:performance.now()};
  e.preventDefault();
});
canvas.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId)) return;
  e.preventDefault();
  const p=evtPos(e), prev=ptrs.get(e.pointerId);
  ptrs.set(e.pointerId,p);
  if(ptrs.size===1){
    panBy(p.y-prev.y);
  }else if(ptrs.size===2){
    const [a,b]=[...ptrs.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y), my=(a.y+b.y)/2;
    if(pinchPrev){
      panBy(my-pinchPrev.my);
      if(pinchPrev.d>0&&d>0) zoomAt(my,pinchPrev.d/d);
    }
    pinchPrev={d:d,my:my};
  }
  draw();
});
function endPointer(e){
  const wasSingle=ptrs.size===1;
  ptrs.delete(e.pointerId);
  if(ptrs.size<2) pinchPrev=null;
  if(wasSingle&&downInfo){
    const p=evtPos(e), dt=performance.now()-downInfo.t;
    const moved=Math.hypot(p.x-downInfo.p.x,p.y-downInfo.p.y);
    if(moved<9&&dt<450) handleTap(p);
  }
  if(ptrs.size===0){ downInfo=null; scheduleLink(); }
}
canvas.addEventListener('pointerup',endPointer);
canvas.addEventListener('pointercancel',endPointer);
// Chrome pull-to-refresh: block the browser's overscroll refresh for touches
// starting on the canvas. Pointer handling alone does not always suppress it.
canvas.addEventListener('touchmove',e=>{ e.preventDefault(); },{passive:false});
canvas.addEventListener('wheel',e=>{
  e.preventDefault(); stopAnim(); hidePopover();
  const r=canvas.getBoundingClientRect();
  zoomAt(e.clientY-r.top,Math.exp(e.deltaY*0.0016));
  draw(); scheduleLink();
},{passive:false});
canvas.addEventListener('dblclick',e=>{
  const r=canvas.getBoundingClientRect();
  const y=e.clientY-r.top, tm=tOf(y);
  animateTo(tm+ (state.S/10)/2 - (state.S/10)*y/viewH(), state.S/10, 240);
});
window.addEventListener('keydown',e=>{
  if(e.key==='+'||e.key==='='){ animateTo(state.C,state.S/10,240); }
  else if(e.key==='-'){ animateTo(state.C,state.S*10,240); }
  else if(e.key==='ArrowUp'){ stopAnim(); panBy(viewH()*0.18); draw(); scheduleLink(); }
  else if(e.key==='ArrowDown'){ stopAnim(); panBy(-viewH()*0.18); draw(); scheduleLink(); }
});
document.getElementById('zin').addEventListener('click',()=>animateTo(state.C,state.S/10,240));
document.getElementById('zout').addEventListener('click',()=>animateTo(state.C,state.S*10,240));

function handleTap(p){
  let best=null,bestD=18;
  for(const r of lastPlaced){
    const dx=r.x-p.x, dy=r.y-p.y;
    const inBox=p.x>=r.x0-8&&p.x<=r.x1+8&&p.y>=r.y0-6&&p.y<=r.y1+6;
    const d=Math.hypot(dx,dy);
    if(inBox||d<bestD){ best=r; bestD=inBox?-1:d; if(inBox) break; }
  }
  if(best){ showPopover(best,p); return; }
  for(const r of lastRegionLabels){
    if(p.x>=r.x0&&p.x<=r.x1&&p.y>=r.y0&&p.y<=r.y1){ zoomToRegion(r.conn); return; }
  }
  hidePopover();
}
function zoomToRegion(r){
  const span=r.tEnd-r.tStart;
  if(span<=0) return;
  animateTo((r.tStart+r.tEnd)/2,span*1.25,350);
}

/* ================= popover ================= */
const pop=document.getElementById('pop');
function showPopover(rec,p){
  const ds=rec.ds||state.ds;
  document.getElementById('popTitle').textContent=rec.e.label;
  document.getElementById('popDate').textContent=eventDateStr(rec.e,ds)+(state.selected.length>1?' · '+ds.title:'');
  document.getElementById('popBlurb').textContent=rec.e.blurb||'No details recorded.';
  pop.classList.add('show');
  const pw=pop.offsetWidth, ph=pop.offsetHeight;
  pop.style.left=clamp(p.x+14,8,cssW-pw-8)+'px';
  pop.style.top=clamp(p.y-ph-14,8,viewH()-ph-8)+'px';
}
function hidePopover(){ pop.classList.remove('show'); }
document.getElementById('popClose').addEventListener('click',hidePopover);

/* ================= tray ================= */
const tray=document.getElementById('tray');
function layoutZoomctl(){
  const zc=document.getElementById('zoomctl'), chip=document.getElementById('chip');
  if(window.innerWidth>=720){ zc.style.right=tray.classList.contains('open')?'326px':'58px'; chip.style.right=tray.classList.contains('open')?'312px':'58px'; }
  else { zc.style.right=''; chip.style.right=''; }
}
document.getElementById('trayHandle').addEventListener('click',()=>{
  tray.classList.toggle('open'); layoutZoomctl();
});
window.addEventListener('resize',layoutZoomctl);
function buildTrayList(){
  const box=document.getElementById('dsList'); box.innerHTML='';
  // tags and accents follow the VISIBLE datasets: in background-plus-two
  // extras columns, the hidden background datasets get neither
  const visIds=visibleSets().map(ds=>ds.id);
  const multi=visIds.length>1;
  const merged=mergedView();
  for(const m of state.manifest){
    const idx=visIds.indexOf(m.id);
    const b=document.createElement('button');
    b.className='dsbtn'+(state.selected.includes(m.id)?' active':'');
    const cols=columnsMode();
    b.textContent=m.title+(multi&&idx>=0?(cols?' · '+(idx+1):merged?'':idx===0?' · Left':' · Right'):'');
    // merged mode: the chip's border carries the dataset's accent, matching
    // its dots and labels in the single column
    if(merged&&idx>=0) b.style.borderColor=ACCENTS[idx%ACCENTS.length];
    b.addEventListener('click',()=>{ toggleDataset(m.id); });
    box.appendChild(b);
  }
}
document.getElementById('densitySeg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  state.density=parseFloat(b.dataset.d);
  [...e.currentTarget.children].forEach(x=>x.classList.toggle('active',x===b));
  needRender=true; draw();
});
const regionSwitch=document.getElementById('regionSwitch');
regionSwitch.addEventListener('click',()=>{
  state.regions=!state.regions;
  regionSwitch.classList.toggle('on',state.regions);
  regionSwitch.setAttribute('aria-checked',state.regions);
  needRender=true; draw();
});
document.getElementById('resetBtn').addEventListener('click',resetView);
function jumpToPresent(){
  // Present looks for a present preset across the visible datasets, not
  // just the first selected one: in a merged background view the first
  // dataset (earth) has none, but human and universe do
  const vds=visibleSets(); if(!vds.length) return;
  const pDs=vds.find(ds=>(ds.presets||[]).some(x=>x.id==='present'));
  stopAnim();
  if(pDs){ const p=pDs.presets.find(x=>x.id==='present'); animateTo(p.c,p.s,350); }
  else{ const ds=state.ds||vds[0]; animateTo(ds.end-ds.minSpan/2,ds.minSpan,350); }
}
document.getElementById('presentBtn').addEventListener('click',jumpToPresent);

/* ================= boot ================= */
(async function(){
  resize();
  try{ await loadAll(); }
  catch(err){
    chipMain.textContent='Could not load data';
    chipSub.textContent=String(err&&err.message||err);
    return;
  }
  const q=new URLSearchParams(location.search);
  const wanted=(q.get('d')||'').split(',').filter(id=>state.sets[id]);
  const first=wanted.length?wanted:['early-modern-italy-art','early-modern-italy-writing','early-modern-italy-figures','early-modern-italy-wars','early-modern-italy-europe'];
  setDatasets(first);
  layoutZoomctl();
  draw();
})();
</script>
